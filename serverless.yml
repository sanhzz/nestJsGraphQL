service: nestjs-graphql-backend

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  environment:
    NODE_ENV: ${self:provider.stage}
    DATABASE_URL: ${env:DATABASE_URL}
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN, '7d'}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - rds-db:connect
      Resource: "*"

functions:
  graphql:
    handler: dist/lambda.handler
    events:
      - http:
          path: graphql
          method: any
          cors: true
      - http:
          path: '/'
          method: any
          cors: true

plugins:
  - serverless-plugin-typescript

custom:
  serverless-plugin-typescript:
    typescript: typescript